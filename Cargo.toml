[package]
name = "trackfast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A native desktop timer for Toggl Track"
repository = "https://github.com/BilliGraham/trackfast"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
