[package]
name = "trackfast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "A native desktop timer for Toggl Track"
repository = "https://github.com/BilliGraham/trackfast"

[dependencies]
base64 = "0.23"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
jiff = { version = "0.2", features = ["serde"] }
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
