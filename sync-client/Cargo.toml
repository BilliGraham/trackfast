[package]
name = "trackfast-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
