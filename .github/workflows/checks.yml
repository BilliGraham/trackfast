name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trackfast_test
          POSTGRES_PASSWORD: trackfast_test_only
          POSTGRES_DB: trackfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackfast_test -d trackfast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACKFAST_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=trackfast_test password=trackfast_test_only dbname=trackfast_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check server formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all --check
      - name: Check server lints
        run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run Postgres integration tests
        run: cargo test --manifest-path server/Cargo.toml --locked --all-targets
      - name: Build server
        run: cargo build --manifest-path server/Cargo.toml --locked
  api-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: python -m pip install -r tools/requirements-contract.txt
      - name: Validate the API contract
        run: python -B -m unittest discover -s tools -p test_api_contract.py
  timer-model:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Create test output directory
        shell: bash
        run: mkdir -p target/timer-tests
      - name: Compile the standalone timer tests
        run: rustc --edition=2024 --crate-name trackfast --test src/lib.rs -D warnings --out-dir target/timer-tests
      - name: Run timer tests on Windows
        if: runner.os == 'Windows'
        run: ./target/timer-tests/trackfast.exe
      - name: Run timer tests on Linux
        if: runner.os == 'Linux'
        run: ./target/timer-tests/trackfast
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Resolve initial dependencies
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked
